# jarunixOS 1.0 —— UEFI 引导菜单（GRUB 2）
#
# GRUB 的 gfxterm 使用内置位图字体，无法显示中文，因此菜单文字一律使用 ASCII。

set timeout=10
set timeout_style=menu
set default=0

# UEFI 下 GRUB 从 EFI 分区（efi.img）启动，先定位到 ISO 根
search --no-floppy --set=root --label JARUNIXOS
search --no-floppy --set=root --file /live/vmlinuz

# gfxterm 必须加载位图字体才能渲染文字；缺字体会导致菜单一片空白
insmod all_video
if loadfont /boot/grub/fonts/unicode.pf2; then
    insmod gfxterm
    set gfxmode=auto
    terminal_output gfxterm
fi

# 串口镜像输出（无串口时自动忽略；用于无显示环境的引导诊断）
if serial --unit=0 --speed=115200; then
    terminal_input --append serial
    terminal_output --append serial
fi

menuentry "Start jarunixOS 1.0   (Live desktop, recommended)" {
    linux  /live/vmlinuz boot=live components quiet
    initrd /live/initrd.img
}

menuentry "Start jarunixOS 1.0   (safe graphics, VESA)" {
    linux  /live/vmlinuz boot=live components nomodeset xforcevesa quiet
    initrd /live/initrd.img
}

menuentry "Start jarunixOS 1.0   (text mode, no GUI)" {
    linux  /live/vmlinuz boot=live components systemd.unit=multi-user.target quiet
    initrd /live/initrd.img
}

menuentry "Start jarunixOS 1.0   (serial console, for debugging)" {
    linux  /live/vmlinuz boot=live components console=ttyS0,115200 quiet
    initrd /live/initrd.img
}
