UI menu.c32
PROMPT 0
TIMEOUT 300
DEFAULT jarunix-live

MENU TITLE jarunixOS 1.0 — Java 桌面发行版

LABEL jarunix-live
  MENU LABEL ^1) jarunixOS 1.0 启动（图形化安装 / 试用）
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components quiet

LABEL jarunix-safe
  MENU LABEL ^2) 安全模式（VESA 兼容显示）
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components nomodeset xforcevesa quiet

LABEL jarunix-nox
  MENU LABEL ^3) 文本模式（仅启动到控制台）
  KERNEL /live/vmlinuz
  APPEND initrd=/live/initrd.img boot=live components systemd.unit=multi-user.target quiet
